plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.luckking.odds'
    compileSdk 34

    defaultConfig {
        applicationId 'com.luckking.odds'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// 零第三方依赖：只用 Android SDK 本身，WebView 里跑网页版全部计算逻辑
dependencies {
}
