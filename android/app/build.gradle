plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.luckking.odds'
    compileSdk 34

    defaultConfig {
        applicationId 'com.luckking.odds'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// OCR：ML Kit 中文文字识别（bundled 版，模型打进 APK，无需 GMS、无需网络）
// 其他零第三方依赖：WebView 复用网页版计算逻辑，无障碍服务保留做状态诊断
dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
